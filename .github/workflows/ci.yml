# Every pull request and every push to main: the same checks CLAUDE.md asks for before a PR.
#   unit   npm test (tests that need a database skip themselves)
#   db     npm run test:db against a throwaway Postgres 16 (scripts/db-test.sh rebuilds it
#          from supabase/migrations + seed with supabase/tests/supabase-shim.sql)
#   build  next build
# Nothing here touches Supabase or Railway; deploys still happen when main changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database tests
        run: npm run test:db
        env:
          SUPABASE_TEST_DB_URL: postgres://postgres@localhost:5432/booking_test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
